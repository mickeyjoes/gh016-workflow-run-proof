name: build-and-test

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - attacker-trigger.txt
      - .github/workflows/build-and-test.yml

permissions:
  contents: read

jobs:
  pr-ci-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Write normal PR metadata
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          mkdir -p pr-ci-metadata
          jq -n \
            --argjson number "$PR_NUMBER" \
            --arg headSha "$HEAD_SHA" \
            --arg headRef "$HEAD_REF" \
            --arg headRepo "$HEAD_REPO" \
            --arg baseRef "$BASE_REF" \
            '{number:$number,headSha:$headSha,headRef:$headRef,headRepo:$headRepo,baseRef:$baseRef,isFork:true}' \
            > pr-ci-metadata/pr.json
      - name: Upload PR metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-ci-metadata
          path: pr-ci-metadata/pr.json

name: GH016 corrected control

on:
  workflow_run:
    workflows: [build-and-test]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  report:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Download untrusted PR metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: pr-ci-metadata
          path: pr-ci-metadata
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Capture actual workflow_run payload and artifact binding
        run: |
          mkdir -p gh016-evidence
          cp "$GITHUB_EVENT_PATH" gh016-evidence/workflow_run.json
          cp pr-ci-metadata/pr.json gh016-evidence/pr.json
      - name: Run corrected binding
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH016_MODE: control
        run: node scripts/reporter.mjs
      - name: Upload hosted proof evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gh016-control-evidence
          path: gh016-evidence
          if-no-files-found: error
          retention-days: 7
